[project]
name = "ximenes"
version = "0.0.0"
description = "Cryptic crossword clues: propose, verify (sound by grammar), decide (Bayesian)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
    "ollama>=0.6.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
